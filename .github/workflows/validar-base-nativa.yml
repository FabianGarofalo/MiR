name: MiR | Validar base nativa V2 (NO compila cliente)

on:
  push:
    paths:
      - 'native-v2/**'
      - '.github/workflows/validar-base-nativa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Código MiR
        uses: actions/checkout@v4
      - name: Base Flutter/Rust fijada
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 95cca3f661f635b3cc85c04935fe8d96d8f432ef
          path: upstream
          submodules: false
          persist-credentials: false
      - name: Comprobar origen y preparar componentes
        run: |
          python3 native-v2/stage_components.py --upstream upstream
      - name: Publicar informe de estructura
        uses: actions/upload-artifact@v4
        with:
          name: MiR-V2-Validacion-Estructura-NO-BINARIO
          path: native-v2/integration-report.json
          if-no-files-found: error
