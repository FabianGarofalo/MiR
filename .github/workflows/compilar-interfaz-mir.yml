name: MiR V2 | Compilar interfaz Windows con motor verificado
# Build completo de saneamiento MiR: Ajustes, regreso, popups, iconos y Acerca de sin pantalla antigua.

on:
  push:
    paths:
      - '.github/workflows/compilar-interfaz-mir.yml'
      - 'native-v2/**'
      - 'native_pending/**'
      - 'legacy-v1.5/payload/assets/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-ui:
    name: MiR V2 interfaz Flutter + motor nativo previamente verificado
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Código de MiR
        uses: actions/checkout@v4
        with:
          path: mir
      - name: Motor Flutter/Rust fijado
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 95cca3f661f635b3cc85c04935fe8d96d8f432ef
          path: upstream
          submodules: false
          persist-credentials: false
      - name: Descargar puente ya compilado para el mismo origen
        uses: actions/download-artifact@v4
        with:
          name: mir-v2-bridge-generado
          run-id: 45073323311
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: upstream
      - name: Descargar el motor nativo ya compilado y verificado
        uses: actions/download-artifact@v4
        with:
          name: MiR-V2-Windows-Portable-e-Instalador-PREVIEW-SIN-FIRMA
          run-id: 45073323311
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: previous
      - name: Extraer motor y verificar identidad anterior
        shell: pwsh
        run: |
          $zip = "previous/dist/MiR_V2_Portable_PREVIEW_SIN_FIRMA.zip"
          if (!(Test-Path $zip)) { throw "Falta el portable original verificado" }
          Expand-Archive -LiteralPath $zip -DestinationPath previous-portable -Force
          if (!(Test-Path "previous-portable/MiR.exe")) { throw "Falta MiR.exe original" }
          if (!(Test-Path "previous-portable/librustdesk.dll")) { throw "Falta DLL Rust integrada" }
          if (Test-Path "previous-portable/rustdesk.exe") { throw "No se acepta un ejecutable externo" }
          # El CMake original copia la biblioteca integrada desde target/release.
          # Reutilizar exactamente la biblioteca ya compilada en el build validado.
          New-Item -ItemType Directory "upstream/target/release" -Force | Out-Null
          Copy-Item "previous-portable/librustdesk.dll" "upstream/target/release/librustdesk.dll" -Force
          if (!(Test-Path "upstream/target/release/librustdesk.dll")) { throw "Falta DLL integrada para CMake" }
      - name: Aplicar UI MiR nativa con acciones reales
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python mir/native-v2/stage_components.py --upstream upstream --components mir/native_pending/lib --report mir/native-v2/integration-report.json
          python mir/native-v2/apply_mir_native.py --upstream upstream --repo mir --report mir/native-v2/native-patch-report.json
          python mir/native-v2/finish_mir_identity.py --upstream upstream --repo mir --report mir/native-v2/identity-report.json
          python mir/native-v2/apply_mir_home.py --upstream upstream --repo mir --report mir/native-v2/mir-home-report.json
          python mir/native-v2/apply_mir_settings.py --upstream upstream --repo mir --report mir/native-v2/mir-settings-report.json
          # Acerca de MiR se crea en apply_mir_settings; no verificarlo antes.
          # El toolbar nativo original se verifica antes de transformar su color.
          python mir/native-v2/verify_native_patch.py --upstream upstream
          python mir/native-v2/verify_mir_identity.py --upstream upstream
          python mir/native-v2/verify_mir_settings.py --upstream upstream
          python mir/native-v2/verify_mir_home.py --upstream upstream
          python mir/native-v2/apply_mir_connection_ui.py --upstream upstream --repo mir --report mir/native-v2/mir-connection-ui-report.json
          python mir/native-v2/verify_mir_connection_ui.py --upstream upstream
          Copy-Item "mir/native-v2/flutter/mir_server_page.dart" "upstream/flutter/lib/desktop/pages/server_page.dart" -Force
          Copy-Item "mir/native-v2/flutter/mir_receiver_layout.dart" "upstream/flutter/lib/mir/mir_receiver_layout.dart" -Force
          Copy-Item "mir/native-v2/flutter/mir_receiver_process_probe.dart" "upstream/flutter/lib/mir/mir_receiver_process_probe.dart" -Force
          Copy-Item "mir/native-v2/flutter/test/mir_receiver_layout_test.dart" "upstream/flutter/test/mir_receiver_layout_test.dart" -Force
          python mir/native-v2/verify_mir_receiver_ui.py --upstream upstream
      - name: Flutter Windows 3.24.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
      - name: Preparar motor gráfico Flutter Windows compatible
        shell: pwsh
        run: |
          flutter precache --windows
          $bin = (Get-Command flutter).Source
          $flutterRoot = Split-Path (Split-Path $bin -Parent) -Parent
          Invoke-WebRequest -Uri "https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip" -OutFile "engine-win.zip"
          Expand-Archive -Path "engine-win.zip" -DestinationPath "engine-expanded"
          $dst = Join-Path $flutterRoot "bin/cache/artifacts/engine/windows-x64-release"
          $src = if (Test-Path "engine-expanded/windows-x64-release") { "engine-expanded/windows-x64-release" } else { "engine-expanded" }
          Copy-Item "$src/*" $dst -Recurse -Force
          if (!(Test-Path (Join-Path $dst "flutter_windows.dll"))) { throw "Falta Flutter Engine" }
          $patch = (Resolve-Path "upstream/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff").Path
          & git -C $flutterRoot apply $patch
          if ($LASTEXITCODE -ne 0) { throw "No se pudo aplicar parche Flutter del origen" }
      - name: Resolver dependencias y analizar interfaz
        shell: pwsh
        working-directory: upstream/flutter
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw "No se resolvieron las dependencias Flutter" }
          flutter analyze --no-fatal-infos lib/mir/mir_home_shell.dart lib/mir/mir_receiver_diagnostics.dart lib/mir/mir_about_page.dart lib/mir/mir_settings_router.dart lib/mir/mir_connection_theme.dart lib/mir/mir_receiver_layout.dart lib/mir/mir_receiver_process_probe.dart lib/desktop/pages/desktop_setting_page.dart lib/desktop/pages/desktop_tab_page.dart lib/desktop/pages/remote_page.dart lib/desktop/pages/server_page.dart lib/desktop/widgets/remote_toolbar.dart lib/desktop/widgets/tabbar_widget.dart
          if ($LASTEXITCODE -ne 0) { throw "Error de código Dart MiR" }
      - name: Probar geometría del receptor en todos los estados
        shell: pwsh
        working-directory: upstream/flutter
        run: |
          flutter test test/mir_receiver_layout_test.dart --reporter expanded
          if ($LASTEXITCODE -ne 0) { throw "MIR: botones recortados o superpuestos en prueba de receptor" }
      - name: Compilar nuevo MiR.exe y assets Flutter
        shell: pwsh
        working-directory: upstream/flutter
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw "No se pudo compilar MiR.exe" }
      - name: Integrar motor con interfaz MiR y probar arranque
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory "mir/native-v2/dist/portable" -Force | Out-Null
          Copy-Item "previous-portable/*" "mir/native-v2/dist/portable/" -Recurse -Force
          $new = "upstream/flutter/build/windows/x64/runner/Release"
          if (!(Test-Path "$new/MiR.exe")) { throw "El cliente recompilado no genera MiR.exe" }
          Copy-Item "$new/*" "mir/native-v2/dist/portable/" -Recurse -Force
          Copy-Item "mir/native-v2/windows/MiR_Corregir_Receptor.ps1" "mir/native-v2/dist/portable/MiR_Corregir_Receptor.ps1" -Force
          Copy-Item "mir/native-v2/windows/MiR_Corregir_Receptor.cmd" "mir/native-v2/dist/portable/MiR_Corregir_Receptor.cmd" -Force
          $exe = (Resolve-Path "mir/native-v2/dist/portable/MiR.exe").Path
          $meta = (Get-Item $exe).VersionInfo
          if ($meta.ProductName -ne 'MiR') { throw "ProductName inesperado: $($meta.ProductName)" }
          if (!(Test-Path "mir/native-v2/dist/portable/librustdesk.dll")) { throw "Falta el motor remoto" }
          if (Test-Path "mir/native-v2/dist/portable/rustdesk.exe") { throw "No se debe incluir rustdesk.exe" }
          $process = Start-Process -FilePath $exe -ArgumentList '--version' -WorkingDirectory (Split-Path $exe -Parent) -PassThru
          if (!$process.WaitForExit(30000)) { $process.Kill(); throw "MiR.exe no inició correctamente" }
          if ($process.ExitCode -ne 0) { throw "Falló arranque de MiR.exe con código $($process.ExitCode)" }
      - name: Verificar que el binario Flutter incluya la UI MiR actualizada
        shell: pwsh
        run: |
          python mir/native-v2/verify_mir_release.py --portable mir/native-v2/dist/portable
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "mir/native-v2/dist/portable/MiR_Corregir_Receptor.ps1" -Modo Diagnostico
          if ($LASTEXITCODE -ne 0) { throw "MiR: diagnostico de procesos Windows no pudo ejecutarse" }
      - name: Generar portable y su instalador de prueba
        shell: pwsh
        run: |
          $portable = "mir/native-v2/dist/portable"
          Copy-Item "upstream/LICENCE" "$portable/LICENCE" -Force
          Copy-Item "mir/legacy-v1.5/payload/MiRemoto.ico" "$portable/MiR.ico" -Force
          Copy-Item "mir/native-v2/windows/MiR_Corregir_Receptor.ps1" "$portable/MiR_Corregir_Receptor.ps1" -Force
          Copy-Item "mir/native-v2/windows/MiR_Corregir_Receptor.cmd" "$portable/MiR_Corregir_Receptor.cmd" -Force
          if (!(Test-Path "$portable/MiR_Corregir_Receptor.ps1") -or !(Test-Path "$portable/MiR_Corregir_Receptor.cmd")) { throw "Falta corrector de receptor" }
          @'
          MiR V2 — INTERFAZ NATIVA MI R (PREVIEW SIN FIRMA)
          Aplicación principal: MiR.exe. Motor remoto incluido.
          No requiere instalación separada de RustDesk para abrir la aplicación.
          No desinstalar receptor anterior hasta verificar recepción con bloqueo, reinicio y antes del PIN.
          Sin firma digital: si el antivirus lo bloquea, no desactivar la protección.
          '@ | Set-Content "$portable/LEER_ANTES_DE_USAR.txt" -Encoding UTF8
          Compress-Archive -Path "$portable/*" -DestinationPath "mir/native-v2/dist/MiR_V2_Portable_PREVIEW_SIN_FIRMA.zip" -Force
          $source = (Resolve-Path $portable).Path
          # MiR.exe es un launcher Flutter, no un servicio SCM verificado.
          $installerSource = Get-Content "mir/native-v2/packaging/MiR-preview.iss" -Raw
          if ($installerSource -match '(?i)--service-control|create-service-with-rollback|Name:\s*unattended\b') {
            throw "MIR: instalador intenta registrar launcher Flutter como servicio Windows no validado"
          }
          $iscc = "C:/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DSourceDir=$source" "mir/native-v2/packaging/MiR-preview.iss"
          if ($LASTEXITCODE -ne 0) { throw "Falló generación del instalador MiR" }
      - name: Generar hash SHA-256
        shell: pwsh
        run: |
          Get-ChildItem "mir/native-v2/dist" -File |
            Get-FileHash -Algorithm SHA256 |
            Select-Object Path,Hash |
            ConvertTo-Json -Depth 3 |
            Set-Content "mir/native-v2/dist/SHA256.json"
      - name: Publicar MiR V2 con nueva interfaz para pruebas
        uses: actions/upload-artifact@v4
        with:
          name: MiR-V2-Interfaz-Propia-Windows-PREVIEW-SIN-FIRMA
          path: |
            mir/native-v2/dist/MiR_V2_Portable_PREVIEW_SIN_FIRMA.zip
            mir/native-v2/dist/MiR_V2_Instalador_PREVIEW_SIN_FIRMA.exe
            mir/native-v2/dist/SHA256.json
            mir/native-v2/mir-home-report.json
            mir/native-v2/mir-settings-report.json
            mir/native-v2/mir-connection-ui-report.json
          if-no-files-found: error
