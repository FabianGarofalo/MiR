name: MiR | Validar fuentes de host de servicio sin compilar
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/validar-host-mir-fuentes.yml'
      - 'native-v2/host-candidate/**'

permissions:
  contents: read

jobs:
  source-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: mir
      - uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 95cca3f661f635b3cc85c04935fe8d96d8f432ef
          submodules: false
          persist-credentials: false
          path: upstream
      - name: Comprobar adaptacion e identidad tecnica de host
        shell: bash
        run: |
          set -euo pipefail
          python3 mir/native-v2/host-candidate/prepare_host.py --upstream upstream --repo mir
          test -f upstream/flutter/lib/mir/mir_receiver_layout.dart
          test -f upstream/flutter/lib/mir/mir_receiver_process_probe.dart
          grep -q 'set(BINARY_NAME "rustdesk")' upstream/flutter/windows/CMakeLists.txt
          grep -q 'window_title = L"MiR - Receptor";' upstream/flutter/windows/runner/main.cpp
          if grep -q 'APP_NAME.write().unwrap() = "MiR"' upstream/src/core_main.rs; then
            echo "ERROR: nombre de servicio fue cambiado" >&2
            exit 1
          fi
          echo "OK: host RustDesk con UI MIR; sin renombrar servicio SCM"
      - name: Guardar evidencia de fuente (NO binario)
        uses: actions/upload-artifact@v4
        with:
          name: MiR-host-fuente-auditada-NO-BINARIO
          path: mir/native-v2/host-*-report.json
          if-no-files-found: error
